# Clasificación funcional de objetos del diccionario Sevcon Gen4.
#
# Sintaxis de reglas (todos los índices y subíndices en HEX, como en el DCF):
#   { index = "4641", subs = ["2", "3", "1D"] }   -> subíndices concretos del objeto
#   { index = "4641", subs = ["1-4"] }            -> rango de subíndices (inclusivo)
#   { index = "6076" }                            -> objeto completo (todas sus subs)
#   { range = ["2906", "2908"] }                  -> rango de objetos (inclusivo)
#
# Resolución (independiente del orden de los grupos):
#   1. Gana la regla más específica: index+subs > index > range.
#   2. A igual especificidad, gana la primera que aparece en este fichero.
#   3. Sin coincidencia -> grupo `fallback`.
#
# motor_control = true marca los grupos que la UI destaca con ★ y filtra con
# "Solo control de motor". Ver docs/sevcon_parameters.md para el porqué de cada objeto.

fallback = "other"

[[group]]
id = "motor_base"
label = "Datos base del motor"
motor_control = true
order = 10
rules = [
    { index = "4641", subs = ["2", "3", "5", "7", "C", "12"] },
    { index = "6075" },
    { index = "6076" },
    { index = "6080" },
    { index = "2916", subs = ["1"] },
    { index = "4617", subs = ["2"] },
    { index = "4641" },  # resto de 4641 (cabecera, commit) cae aquí
]

[[group]]
id = "electrical_model"
label = "Modelo eléctrico / inductancias"
motor_control = true
order = 20
rules = [
    { index = "4641", subs = ["A", "2B", "E"] },
    { index = "4617", subs = ["1", "3", "4"] },
    { index = "4621", subs = ["4-7"] },
]

