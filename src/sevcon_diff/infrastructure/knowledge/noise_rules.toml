# Reglas de "ruido": valores de monitorización / registro que cambian en cada
# guardado del DCF y NO son cambios de configuración. La UI los oculta por defecto
# ("Mostrar monitorización" los vuelve a enseñar).
#
# Un parámetro es ruido si se cumple CUALQUIERA de:
#   - su CATEGORY (heredada del objeto padre) está en `categories`
#   - su AccessType está en `access_types`
#   - coincide con alguna regla de [[noise]]
# ...salvo que coincida con alguna regla de [[keep]] (excepciones, ganan siempre).
#
# Misma sintaxis de reglas que parameter_groups.toml (index / subs / range, en HEX).

categories = ["MONITORING", "LOGGING"]
access_types = ["ro", "const"]

# Objetos que se muestran en el resumen como indicador, nunca como cambio.
[indicators]
checksum = "5620"

[[noise]]
reason = "Contadores de horas"
rules = [
    { range = ["2781", "2786"] },
    { index = "4601" },
    { index = "5200" },
]

[[noise]]
reason = "Odómetro / trip"
rules = [{ index = "29A0" }, { index = "29A1" }]

