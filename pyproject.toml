[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sevcon-dcf-diff"
version = "0.1.0"
description = "Comparador de ficheros DCF del inversor Sevcon Gen4 (MotoStudent)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2",
    "jinja2>=3.1",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
sevcon-diff = "sevcon_diff.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sevcon_diff = [
    "infrastructure/knowledge/*.toml",
    "infrastructure/exporters/templates/*.j2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["sevcon_diff"]

[[tool.mypy.overrides]]
module = ["customtkinter.*", "fpdf.*"]
ignore_missing_imports = true
